name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-web.txt
      - run: python process.py --offline
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check discovery reconnect and result flows
        run: |
          npm install --prefix "$RUNNER_TEMP/irrationalfan-ui" jsdom@31 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/irrationalfan-ui/node_modules" node tests/webapp_ui.cjs

  build-dataset:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-web.txt
      - name: Refresh current-season data and build dataset
        run: python process.py --download
      - name: Verify processed dataset
        run: |
          test -s cfb_team_games.parquet
          ls -lh cfb_team_games.parquet
      - name: Upload refreshed dataset
        uses: actions/upload-artifact@v4
        with:
          name: cfb-team-games
          path: cfb_team_games.parquet
          if-no-files-found: error
          retention-days: 7
