name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-web.txt
      - run: python process.py --offline
      - run: python -m pytest -q
      - name: Verify processed dataset
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          test -s cfb_team_games.parquet
          ls -lh cfb_team_games.parquet
      - name: Upload processed dataset
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: cfb-team-games
          path: cfb_team_games.parquet
          if-no-files-found: error
          retention-days: 7
